; HD trailer/still capture override — drop next to project.godot (cp tools/hd_capture/override.cfg .)
; canvas_items stretch renders UI/text at native window res; the recorder sizes itself
; before _ready, so this must be an override, not a runtime setting. Remove after capture.
[display]
window/stretch/mode="canvas_items"
window/size/window_width_override=1920
window/size/window_height_override=1080
window/size/always_on_top=true
