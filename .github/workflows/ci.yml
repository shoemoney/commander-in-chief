name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # nightly 3-hour soak only (see the `soak` job's `if:`)

# Superseded runs are dead weight: two runs once sat queued 4h42m reporting
# nothing while the branch had already moved on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the engine version lives in tools/versions.lock
# -- the `resolve-godot-version` step below reads it so this file never
# drifts from what the sim's determinism goldens were recorded against.

jobs:
  resolve-godot-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # `shell: bash` is load-bearing: it turns on pipefail. Without it a failed
      # grep here yields an EMPTY version that the setup-godot action then chokes
      # on much later -- exactly how the last CI break went unnoticed for 6 pushes.
      - id: read
        shell: bash
        run: |
          v=$(grep '^godot_version=' tools/versions.lock | cut -d= -f2 | sed 's/-stable$//')
          if [ -z "$v" ]; then
            echo "::error::could not resolve godot_version from tools/versions.lock"
            exit 1
          fi
          echo "resolved Godot $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # Static invariant gates -- seconds, one runner. lint_sim is the guard on the
  # no-floats/no-engine-RNG/no-Time/no-scene-tree rule the entire cross-arch
  # determinism story rests on; lint_assets catches a PNG landing without its
  # .import sidecar. Both were committed and then run by nothing until now.
  lint:
    needs: resolve-godot-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ needs.resolve-godot-version.outputs.version }}
          use-dotnet: false

      - name: Import assets
        shell: bash
        run: godot --headless --path . --import

      - name: Lint sim determinism invariants
        shell: bash
        run: godot --headless --path . -s res://tools/lint_sim.gd

      - name: Lint asset .import sidecars
        shell: bash
        run: godot --headless --path . -s res://tools/lint_assets.gd

      - name: Lint i18n string extraction (locale .po sync)
        shell: bash
        run: python3 tools/i18n_check.py

  # Cross-platform + cross-arch test gate: the deterministic core must produce
  # bit-identical golden checksums on every OS/arch combo the game ships on
  # (test_determinism.gd asserts this). SCRIPT ERROR in the log is a hard fail
  # even if every assertion happens to pass (see CLAUDE.md test-running note).
  test:
    needs: resolve-godot-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ needs.resolve-godot-version.outputs.version }}
          use-dotnet: false

      - name: Import assets
        shell: bash
        run: godot --headless --path . --import

      # This step used to assert NOTHING -- and smoke.gd's own exit code can't
      # carry the signal: with main.gd failing to PARSE, the scene still
      # instantiates, the frame counter still runs, and smoke.gd prints
      # "SMOKE OK" and exits 0 (verified locally). So grep the log for both the
      # sentinel and SCRIPT ERROR. The step timeout covers the other failure
      # mode: if main.tscn fails to LOAD, _initialize dies before connecting
      # process_frame, the SceneTree spins forever, and the job used to sit
      # there for the default 360 minutes instead of failing.
      - name: Boot smoke test (scene tree + view layer)
        shell: bash
        timeout-minutes: 5
        run: |
          godot --headless --path . -s res://tools/smoke.gd 2>&1 | tee smoke.log
          if ! grep -q "SMOKE OK" smoke.log; then
            echo "::error::smoke.gd never reached its SMOKE OK sentinel -- the main scene did not survive 200 frames"
            exit 1
          fi
          if grep -q "SCRIPT ERROR" smoke.log; then
            echo "::error::SCRIPT ERROR during boot smoke -- main.gd/view failed to parse or threw at runtime (smoke.gd still reaches SMOKE OK in this case, so the sentinel alone can't catch it)"
            exit 1
          fi
          # Shutdown leak gate. Godot prints these AFTER the file logger is torn
          # down, so they live ONLY on the process's stdout -- no widening of
          # run_tests.gd's engine-error gate (which reads user://logs) can reach
          # them. tools/run_tests.sh carries the same gate for local runs; CI
          # calls godot directly, so it needs its own copy.
          #
          # ZERO, with no floor and no exemption. Booting the real scene DOES
          # leave audio mid-playback at quit() -- the AudioServer is torn down
          # after ObjectDB::cleanup, so live streams are counted as leaks (smoke
          # sat at 2 AudioStreamPlaybackPolyphonic, e2e_playthrough at 30 objects
          # plus a retained cmd_levelstart_6.mp3). That is a teardown artifact,
          # not a defect -- so the tools that boot src/main.tscn quiesce their own
          # audio graph (tools/quiesce.gd) rather than this gate carrying a floor
          # that would also hide two genuinely orphaned Nodes. Each of smoke,
          # e2e_playthrough and perf_probe measures 0 on 6-of-6 runs.
          if grep -qE "were leaked|resources still in use at exit|leaked [0-9]+ bytes" smoke.log; then
            echo "::error::shutdown leak diagnostics during boot smoke -- objects outlived the run. --verbose names the classes: only AudioStream* means a tool booted src/main.tscn without 'await Quiesce.teardown(self, main)' (tools/quiesce.gd); anything else means view code is orphaning Nodes."
            grep -E "were leaked|resources still in use at exit|leaked [0-9]+ bytes" smoke.log
            exit 1
          fi

      - name: Full deterministic test suite
        shell: bash
        run: godot --headless --path . -s res://tests/run_tests.gd 2>&1 | tee test_output.log

      - name: Fail on SCRIPT ERROR
        shell: bash
        run: |
          if grep -q "SCRIPT ERROR" test_output.log; then
            echo "::error::SCRIPT ERROR found in test output -- a runtime error can silently abort a test method's remaining assertions without failing the run"
            exit 1
          fi

      - name: Fail unless PASS line present
        shell: bash
        run: grep -qE "^PASS —" test_output.log

      # Same stdout-only gate as the boot smoke above, against the suite log.
      # Baseline before the Sfx/main PREDELETE fix was 265 RIDs / 5192 ObjectDB
      # / 8 resources; required value is 0 matches. The grep covers the whole
      # ~1300-line run and the defect prints its 3 lines once, at exit.
      - name: Fail on shutdown leak diagnostics
        shell: bash
        run: |
          if grep -qE "were leaked|resources still in use at exit|leaked [0-9]+ bytes" test_output.log; then
            echo "::error::shutdown leak diagnostics in test output -- Nodes/Objects allocated by the suite or by view code were never freed"
            grep -E "were leaked|resources still in use at exit|leaked [0-9]+ bytes" test_output.log
            exit 1
          fi

  # GL capture gate — prevents shader regressions that silently smear
  # the soldier/HUD under concussion (the warp must ramp toward the
  # periphery of the player's view, not a fixed screen disc). Runs the
  # real view through gl_compatibility (the only renderer that can read
  # back the framebuffer in CI) and asserts centre-retention >0.9 via
  # the swept probe (probe_concussion_hud.gd). If the warp hits the
  # soldier at full strength, this job goes red. Blocks merge — no
  # continue-on-error, runs on push/PR (not just nightly).
  gl-capture:
    needs: resolve-godot-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ needs.resolve-godot-version.outputs.version }}
          use-dotnet: false

      - name: Import assets
        shell: bash
        run: godot --headless --path . --import

      - name: Install xvfb (GL framebuffer)
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: GL concussion HUD probe (centre-retention >0.9)
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path . --rendering-method gl_compatibility -s res://tools/probe_concussion_hud.gd 2>&1 | tee probe.log
          if ! grep -q "PROBE OK" probe.log; then
            echo "::error::probe_concussion_hud did not report PROBE OK — see probe.log"
            cat probe.log
            exit 1
          fi
          if grep -q "SCRIPT ERROR" probe.log; then
            echo "::error::SCRIPT ERROR during GL probe"
            cat probe.log
            exit 1
          fi
          # Centre-retention >0.9: the probe's own floor is 0.70, but the
          # shipped worst-sample is 0.98, so 0.9 is the regression signal.
          # Parse the first 'keep' after 'centre' on each pose line.
          python3 - << 'PY'
          import re, sys
          text = open("probe.log").read()
          keeps = re.findall(r"centre \d+->\d+ \(keep ([0-9.]+)", text)
          if not keeps:
              print("::error::no centre keep ratios found in probe.log")
              sys.exit(1)
          for k in keeps:
              v = float(k)
              if v <= 0.9:
                  print(f"::error::centre-retention {v} <= 0.9 — concussion warp smeared the player")
                  sys.exit(1)
          print(f"centre-retention ok: {keeps}")
          PY

  # Export smoke: prove the real shippable Linux binary boots and survives a
  # few seconds under the actual export pipeline (export_presets.cfg), not
  # just the editor/headless test harness above.
  export-smoke:
    needs: resolve-godot-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Godot (with export templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ needs.resolve-godot-version.outputs.version }}
          use-dotnet: false
          include-templates: true

      - name: Import assets
        run: godot --headless --path . --import

      - name: Export Linux x86_64 build
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Linux x86_64" build/CommanderInChief-linux.x86_64

      - name: Boot the exported binary and auto-quit after 200 frames
        run: |
          set -euo pipefail
          chmod +x build/CommanderInChief-linux.x86_64
          ./build/CommanderInChief-linux.x86_64 --headless --quit-after 200 2>&1 | tee export_smoke.log
          ! grep -q "SCRIPT ERROR" export_smoke.log

      - name: Upload exported Linux build (binary + .pck)
        uses: actions/upload-artifact@v7
        with:
          name: CommanderInChief-linux-x86_64
          path: build/CommanderInChief-linux*
          if-no-files-found: error
          retention-days: 7

  # Windows export smoke: the item's whole point is "ships reliably on
  # Windows, Linux, Proton, and Steam Deck" (Proton runs the Windows build,
  # and Steam Deck's default runtime is Proton) -- so the actual Windows
  # export_presets.cfg preset has to be proven bootable on a real Windows
  # runner, not just assumed to work because the Linux export does.
  export-smoke-windows:
    needs: resolve-godot-version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Godot (with export templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ needs.resolve-godot-version.outputs.version }}
          use-dotnet: false
          include-templates: true

      - name: Import assets
        shell: bash
        run: godot --headless --path . --import

      - name: Export Windows x86_64 build
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Windows x86_64" build/CommanderInChief-windows.exe

      - name: Boot the exported binary and auto-quit after 200 frames
        shell: bash
        run: |
          set -euo pipefail
          ./build/CommanderInChief-windows.exe --headless --quit-after 200 2>&1 | tee export_smoke_windows.log
          ! grep -q "SCRIPT ERROR" export_smoke_windows.log

      - name: Upload exported Windows build (binary + .pck)
        uses: actions/upload-artifact@v7
        with:
          name: CommanderInChief-windows-x86_64
          path: build/CommanderInChief-windows*
          if-no-files-found: error
          retention-days: 7

  # Perf budgets, ADVISORY ONLY (continue-on-error). test_perf.gd asserts
  # wall-clock microseconds per tick; a shared GitHub runner is a noisy
  # neighbour, so those assertions fail for reasons that have nothing to do with
  # the commit. A gate that goes red at random stops being read at all -- which
  # is how the permanent-red CI stopped carrying signal. It still RUNS on every
  # PR (the numbers are in the log, and a real regression shows as a sustained
  # shift), it just no longer blocks. run_tests.gd correspondingly skips
  # test_perf.gd unless SUITE selects it, so the blocking gate above is
  # timing-free.
  perf:
    needs: resolve-godot-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ needs.resolve-godot-version.outputs.version }}
          use-dotnet: false
      - name: Import assets
        shell: bash
        run: godot --headless --path . --import
      - name: Tick-cost budgets (advisory)
        shell: bash
        env:
          SUITE: "perf"
        run: godot --headless --path . -s res://tests/run_tests.gd 2>&1 | tee perf_output.log

  # Real 3-hour memory soak (Steam Deck's typical undocked handheld session
  # length) -- too slow to run on every PR, so it's nightly + manual only.
  # The fast PR gate above still runs test_soak.gd, just at a 10-minute
  # sim-time default (see tests/test_soak.gd DEFAULT_TICKS).
  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: resolve-godot-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ needs.resolve-godot-version.outputs.version }}
          use-dotnet: false
      - name: Import assets
        run: godot --headless --path . --import
      - name: 3-hour-equivalent soak (648000 ticks @ 60 Hz)
        env:
          SOAK_TICKS: "648000"
          SUITE: "soak"
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tests/run_tests.gd 2>&1 | tee soak_output.log

      - name: Fail on SCRIPT ERROR
        run: |
          if grep -q "SCRIPT ERROR" soak_output.log; then
            echo "::error::SCRIPT ERROR found in soak output -- see the fast test job's comment on why this can't be caught by exit code alone"
            exit 1
          fi

      - name: Fail unless PASS line present
        run: grep -qE "^PASS —" soak_output.log
