name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # nightly 3-hour soak only (see the `soak` job's `if:`)

# Superseded runs are dead weight: two runs once sat queued 4h42m reporting
# nothing while the branch had already moved on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the engine version lives in tools/versions.lock
# -- the `resolve-godot-version` step below reads it so this file never
# drifts from what the sim's determinism goldens were recorded against.

# Where the Linux jobs run is a repo VARIABLE, not a line in this file. CI_LINUX_RUNNER unset ->
# GitHub-hosted ubuntu-latest, as before. Set to a JSON label list, e.g.
#   gh variable set CI_LINUX_RUNNER --body '["self-hosted","Linux","X64","swarm"]'
# -> the self-hosted runners with those labels. The macOS and Windows legs are always hosted.
# Delete the variable to go back; no commit needed either way.

jobs:
  resolve-godot-version:
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # `shell: bash` is load-bearing: it turns on pipefail. Without it a failed
      # grep here yields an EMPTY version that the setup-godot action then chokes
      # on much later -- exactly how the last CI break went unnoticed for 6 pushes.
      - id: read
        shell: bash
        run: |
          v=$(grep '^godot_version=' tools/versions.lock | cut -d= -f2 | sed 's/-stable$//')
          if [ -z "$v" ]; then
            echo "::error::could not resolve godot_version from tools/versions.lock"
            exit 1
          fi
          echo "resolved Godot $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # Static invariant gates -- seconds, one runner. lint_sim is the guard on the
  # no-floats/no-engine-RNG/no-Time/no-scene-tree rule the entire cross-arch
  # determinism story rests on; lint_assets catches a PNG landing without its
  # .import sidecar. Both were committed and then run by nothing until now.
  lint:
    needs: resolve-godot-version
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ needs.resolve-godot-version.outputs.version }}
          use-dotnet: false

      - name: Import assets
        shell: bash
        run: godot --headless --path . --import

      - name: Lint sim determinism invariants
        shell: bash
        run: godot --headless --path . -s res://tools/lint_sim.gd

      - name: Lint asset .import sidecars
        shell: bash
        run: godot --headless --path . -s res://tools/lint_assets.gd

      - name: Lint i18n string extraction (locale .po sync)
        shell: bash
        run: python3 tools/i18n_check.py

      # The review harness's verdict gate exists because one model returned its
      # own skill boilerplate instead of a review and it was about to be acted
      # on. A gate nobody ever watched reject is exactly the thing this loop's
      # own history says not to ship, so its ability to FAIL is asserted here.
      - name: Selftest the reviewer verdict gate (must be able to reject)
        shell: bash
        run: python3 tools/loop_review.py selftest

      - name: Verify shipping package contents for every preset
        shell: bash
        run: |
          python3 -m unittest discover -s tools -p test_build_steam_candidates.py -v
          python3 -m unittest discover -s tools -p test_verify_runtime_log.py -v
          python3 -m unittest discover -s tools -p test_verify_native_export.py -v
          python3 -m unittest discover -s tools -p test_package_attribution.py -v
          python3 -m unittest discover -s tools -p test_verify_export_content.py -v
          python3 tools/verify_export_content.py --godot godot

  # Cross-platform + cross-arch test gate: the deterministic core must produce
  # bit-identical golden checksums on every OS/arch combo the game ships on
  # (test_determinism.gd asserts this). SCRIPT ERROR in the log is a hard fail
  # even if every assertion happens to pass (see CLAUDE.md test-running note).
  test:
    needs: resolve-godot-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os == 'ubuntu-latest' && fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') || matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ needs.resolve-godot-version.outputs.version }}
          use-dotnet: false

      - name: Import assets
        shell: bash
        run: godot --headless --path . --import

      # This step used to assert NOTHING -- and smoke.gd's own exit code can't
      # carry the signal: with main.gd failing to PARSE, the scene still
      # instantiates, the frame counter still runs, and smoke.gd prints
      # "SMOKE OK" and exits 0 (verified locally). So grep the log for both the
      # sentinel and SCRIPT ERROR. The step timeout covers the other failure
      # mode: if main.tscn fails to LOAD, _initialize dies before connecting
      # process_frame, the SceneTree spins forever, and the job used to sit
      # there for the default 360 minutes instead of failing.
      - name: Boot smoke test (scene tree + view layer)
        shell: bash
        timeout-minutes: 5
        run: |
          godot --headless --path . -s res://tools/smoke.gd 2>&1 | tee smoke.log
          python3 tools/verify_runtime_log.py smoke.log --require "SMOKE OK"
          if ! grep -q "SMOKE OK" smoke.log; then
            echo "::error::smoke.gd never reached its SMOKE OK sentinel -- the main scene did not survive 200 frames"
            exit 1
          fi
          if grep -q "SCRIPT ERROR" smoke.log; then
            echo "::error::SCRIPT ERROR during boot smoke -- main.gd/view failed to parse or threw at runtime (smoke.gd still reaches SMOKE OK in this case, so the sentinel alone can't catch it)"
            exit 1
          fi
          # Shutdown leak gate. Godot prints these AFTER the file logger is torn
          # down, so they live ONLY on the process's stdout -- no widening of
          # run_tests.gd's engine-error gate (which reads user://logs) can reach
          # them. tools/run_tests.sh carries the same gate for local runs; CI
          # calls godot directly, so it needs its own copy.
          #
          # ZERO, with no floor and no exemption. Booting the real scene DOES
          # leave audio mid-playback at quit() -- the AudioServer is torn down
          # after ObjectDB::cleanup, so live streams are counted as leaks (smoke
          # sat at 2 AudioStreamPlaybackPolyphonic, e2e_playthrough at 30 objects
          # plus a retained cmd_levelstart_6.mp3). That is a teardown artifact,
          # not a defect -- so the tools that boot src/main.tscn quiesce their own
          # audio graph (tools/quiesce.gd) rather than this gate carrying a floor
          # that would also hide two genuinely orphaned Nodes. Each of smoke,
          # e2e_playthrough and perf_probe measures 0 on 6-of-6 runs.
          if grep -qE "were leaked|resources still in use at exit|leaked [0-9]+ bytes" smoke.log; then
            echo "::error::shutdown leak diagnostics during boot smoke -- objects outlived the run. --verbose names the classes: only AudioStream* means a tool booted src/main.tscn without 'await Quiesce.teardown(self, main)' (tools/quiesce.gd); anything else means view code is orphaning Nodes."
            grep -E "were leaked|resources still in use at exit|leaked [0-9]+ bytes" smoke.log
            exit 1
          fi

      - name: Capture teardown uses real time
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          godot --headless --path . --fixed-fps 60 -s res://tools/verify_quiesce.gd 2>&1 | tee quiesce.log
          grep -q 'QUIESCE PASS frozen=false' quiesce.log
          grep -q 'QUIESCE PASS frozen=true' quiesce.log
          if grep -qE '^ERROR:|SCRIPT ERROR|was leaked|were leaked|resources still in use at exit|leaked [0-9]+ bytes' quiesce.log; then
            echo "::error::Capture teardown failed or leaked at shutdown"
            exit 1
          fi

      - name: Production quit paths drain audio
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for route in menu window paused-window; do
            QUIT_PROBE_ROUTE="$route" godot --headless --path . -s res://tools/verify_game_quit.gd 2>&1 | tee "quit-$route.log"
            if ! grep -q "QUIT DRAIN OBSERVED" "quit-$route.log"; then
              echo "::error::Quit route $route did not stop gameplay/audio before exit"
              exit 1
            fi
            if grep -qE '^ERROR:|SCRIPT ERROR|was leaked|were leaked|resources still in use at exit|leaked [0-9]+ bytes' "quit-$route.log"; then
              echo "::error::Quit route $route failed or leaked at shutdown"
              exit 1
            fi
          done

      - name: Source game end-to-end playthrough
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tools/e2e_playthrough.gd 2>&1 | tee e2e.log
          python3 tools/verify_runtime_log.py e2e.log --require "0 FAIL ==="
          python3 - <<'PY'
          import re
          from pathlib import Path
          assert re.search(r"^\[E2E\] === [1-9]\d* checks, 0 FAIL ===$", Path("e2e.log").read_text(), re.MULTILINE), "No completed E2E checks"
          PY

      - name: Run speech reset lifecycle
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tools/verify_run_speech.gd 2>&1 | tee speech.log
          python3 tools/verify_runtime_log.py speech.log --require "RUN SPEECH PASS: 16 checks, 0 failures"

      - name: Full deterministic test suite
        shell: bash
        run: godot --headless --path . -s res://tests/run_tests.gd 2>&1 | tee test_output.log

      - name: Fail on SCRIPT ERROR
        shell: bash
        run: |
          if grep -q "SCRIPT ERROR" test_output.log; then
            echo "::error::SCRIPT ERROR found in test output -- a runtime error can silently abort a test method's remaining assertions without failing the run"
            exit 1
          fi

      - name: Fail unless PASS line present
        shell: bash
        run: grep -qE "^PASS —" test_output.log

      # Same stdout-only gate as the boot smoke above, against the suite log.
      # Baseline before the Sfx/main PREDELETE fix was 265 RIDs / 5192 ObjectDB
      # / 8 resources; required value is 0 matches. The grep covers the whole
      # ~1300-line run and the defect prints its 3 lines once, at exit.
      - name: Fail on shutdown leak diagnostics
        shell: bash
        run: |
          if grep -qE "were leaked|resources still in use at exit|leaked [0-9]+ bytes" test_output.log; then
            echo "::error::shutdown leak diagnostics in test output -- Nodes/Objects allocated by the suite or by view code were never freed"
            grep -E "were leaked|resources still in use at exit|leaked [0-9]+ bytes" test_output.log
            exit 1
          fi

  # GL capture gate — prevents shader regressions that silently smear
  # the soldier/HUD under concussion (the warp must ramp toward the
  # periphery of the player's view, not a fixed screen disc). Runs the
  # real view through gl_compatibility (the only renderer that can read
  # back the framebuffer in CI) and asserts centre-retention >0.75 via
  # the swept probe (probe_concussion_hud.gd). If the warp hits the
  # soldier at full strength, this job goes red. Blocks merge — no
  # continue-on-error, runs on push/PR (not just nightly).
  gl-capture:
    needs: resolve-godot-version
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ needs.resolve-godot-version.outputs.version }}
          use-dotnet: false

      - name: Import assets
        shell: bash
        run: godot --headless --path . --import

      - name: Install xvfb (GL framebuffer)
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: GL concussion HUD probe (centre-retention >0.75)
        shell: bash
        run: |
          set -euo pipefail
          # --fixed-fps 60 is load-bearing, not a nicety: xvfb's software (llvmpipe)
          # GL means real per-frame render time balloons versus a native GPU, and
          # without this flag `delta` in every _process() call reports that real,
          # inflated time. Two things key off delta while the probe's capture window
          # is supposedly frozen: (1) Godot's own physics catch-up runs EXTRA fixed
          # 60Hz ticks per rendered frame to keep sim-time matched to wall-clock time,
          # so the "150-frame settle" the probe waits out before freezing physics
          # lands at a far busier, later point in the run than intended; (2) HUD
          # polish that eases on wall-clock delta (hud.gd's odometer rollup, the
          # chest/score pulse decay, the shop-strip ease, the verb-legend fade) takes
          # one huge visible step per real frame instead of many small ones. Both
          # inflate the "baseline motion between two concussion-0 frames" this probe
          # measures, without concussion doing anything at all. --fixed-fps 60 pins
          # delta to exactly 1/60s regardless of how long xvfb actually took to draw,
          # which is the same fix tools/screenshots.gd already documents for this
          # exact failure mode ("so the time-driven pulses land on the same phase").
          xvfb-run -a godot --path . --rendering-method gl_compatibility --fixed-fps 60 -s res://tools/probe_concussion_hud.gd 2>&1 | tee probe.log
          if ! grep -q "PROBE OK" probe.log; then
            echo "::error::probe_concussion_hud did not report PROBE OK — see probe.log"
            cat probe.log
            exit 1
          fi
          if grep -q "SCRIPT ERROR" probe.log; then
            echo "::error::SCRIPT ERROR during GL probe"
            cat probe.log
            exit 1
          fi
          python3 tools/verify_runtime_log.py probe.log --require "PROBE OK"
          # Centre-retention regression signal, TIGHTER than the probe's own floor
          # (0.70) but not so tight it flakes on legitimate renderer variance. 0.9
          # was picked from Apple M4 Max / Metal-backed OpenGL samples alone (the
          # probe's own docstring: shipped column spreads ~0.98..1.12, worst single
          # sample 0.98) and was NEVER actually exercised on this job's own Linux/
          # xvfb software (llvmpipe) renderer -- every run through 067f70a died
          # earlier, at the noisy-window gate the --fixed-fps 60 fix above resolves.
          # First real Linux measurement (this fix, run 33970848482): 0.85 / 0.87 /
          # 1.10 -- comfortably above the probe's real floor and orders of magnitude
          # above an actual defect (the docstring's own control rows: a smear with
          # no ramp measures ~0.00-0.09, one anchored at screen-centre ~0.01-0.98).
          # 0.75 sits 10 points under the measured Linux floor (room for ordinary
          # run-to-run spread) while staying 5 points tighter than the probe's own
          # 0.70, and nowhere near the ~0.00-0.09 a genuine smear produces.
          # Parse the first 'keep' after 'centre' on each pose line.
          python3 - << 'PY'
          import re, sys
          text = open("probe.log").read()
          keeps = re.findall(r"centre \d+->\d+ \(keep ([0-9.]+)", text)
          if not keeps:
              print("::error::no centre keep ratios found in probe.log")
              sys.exit(1)
          for k in keeps:
              v = float(k)
              if v <= 0.75:
                  print(f"::error::centre-retention {v} <= 0.75 — concussion warp smeared the player")
                  sys.exit(1)
          print(f"centre-retention ok: {keeps}")
          PY

  export-smoke:
    needs: resolve-godot-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            preset: Linux x86_64
            artifact: CommanderInChief-linux.x86_64
          - os: windows-latest
            name: windows-x86_64
            preset: Windows x86_64
            artifact: CommanderInChief-windows.exe
          - os: macos-latest
            name: macos-arm64
            preset: macOS (Apple Silicon + Intel universal)
            artifact: CommanderInChief-macos.zip
    runs-on: ${{ matrix.os == 'ubuntu-latest' && fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') || matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Godot (with export templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ needs.resolve-godot-version.outputs.version }}
          use-dotnet: false
          include-templates: true

      - name: Import assets
        shell: bash
        run: godot --headless --path . --import

      - name: Export native release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-release "${{ matrix.preset }}" "build/${{ matrix.artifact }}" 2>&1 | tee export.log
          python3 tools/verify_runtime_log.py export.log

      - name: Package third-party license and attribution
        shell: bash
        run: |
          python3 tools/package_attribution.py "build/${{ matrix.artifact }}"
          python3 tools/package_attribution.py "build/${{ matrix.artifact }}" --verify

      - name: Check Windows version metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = ((Get-Content project.godot | Select-String '^config/version="([^"]+)"$').Matches.Groups[1].Value) + '.0'
          $metadata = (Get-Item "build/${{ matrix.artifact }}").VersionInfo
          if ($metadata.FileVersion -ne $version -or $metadata.ProductVersion -ne $version) {
            throw "Windows file/product version does not match project version $version"
          }

      - name: Exact release pack campaign and production exit (standard engine)
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Linux" ]; then
            chmod +x "build/${{ matrix.artifact }}"
          fi
          python3 tools/verify_native_export.py "build/${{ matrix.artifact }}" --engine godot --log-dir build/native-smoke

      - name: Upload native release and verification evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: CommanderInChief-${{ matrix.name }}-release
          path: |
            build/CommanderInChief-*
            build/native-smoke/*
            build/licenses/**
            export.log
          if-no-files-found: error
          retention-days: 7

  # Perf budgets, ADVISORY ONLY (continue-on-error). test_perf.gd asserts
  # wall-clock microseconds per tick; a shared GitHub runner is a noisy
  # neighbour, so those assertions fail for reasons that have nothing to do with
  # the commit. A gate that goes red at random stops being read at all -- which
  # is how the permanent-red CI stopped carrying signal. It still RUNS on every
  # PR (the numbers are in the log, and a real regression shows as a sustained
  # shift), it just no longer blocks. run_tests.gd correspondingly skips
  # test_perf.gd unless SUITE selects it, so the blocking gate above is
  # timing-free.
  perf:
    needs: resolve-godot-version
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ needs.resolve-godot-version.outputs.version }}
          use-dotnet: false
      - name: Import assets
        shell: bash
        run: godot --headless --path . --import
      - name: Tick-cost budgets (advisory)
        shell: bash
        env:
          SUITE: "perf"
        run: godot --headless --path . -s res://tests/run_tests.gd 2>&1 | tee perf_output.log

  # Real 3-hour memory soak (Steam Deck's typical undocked handheld session
  # length) -- too slow to run on every PR, so it's nightly + manual only.
  # The fast PR gate above still runs test_soak.gd, just at a 10-minute
  # sim-time default (see tests/test_soak.gd DEFAULT_TICKS).
  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: resolve-godot-version
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ needs.resolve-godot-version.outputs.version }}
          use-dotnet: false
      - name: Import assets
        run: godot --headless --path . --import
      - name: 3-hour-equivalent soak (648000 ticks @ 60 Hz)
        env:
          SOAK_TICKS: "648000"
          SUITE: "soak"
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tests/run_tests.gd 2>&1 | tee soak_output.log

      - name: Fail on SCRIPT ERROR
        run: |
          if grep -q "SCRIPT ERROR" soak_output.log; then
            echo "::error::SCRIPT ERROR found in soak output -- see the fast test job's comment on why this can't be caught by exit code alone"
            exit 1
          fi

      - name: Fail unless PASS line present
        run: grep -qE "^PASS —" soak_output.log
