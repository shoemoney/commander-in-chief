shader_baker/enabled=true

# NOTE: this preset CANNOT be exported with stock Godot templates. The official
# macOS template archive ships only godot_macos_release.universal -- there is no
# .arm64 slice -- so `--export-release "macOS (Apple Silicon native)"` fails with
# `Requested template binary "godot_macos_release.arm64" not found`. Kept because
# it documents the intent and works against custom-built templates. The shipped
# arm64 artifact is produced by thinning the universal build instead:
#   lipo -thin arm64 "<app>/Contents/MacOS/<name>" -output <tmp> && mv <tmp> <bin>
#   codesign --force --deep --sign - "<app>"      # thinning breaks the ad-hoc sig
[preset.3]

name="macOS (Apple Silicon native)"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,docs/*,tools/*"
export_path="build/CommanderInChief-macos-arm64.zip"

[preset.3.options]

export/distribution_type=0
binary_format/architecture="arm64"
application/bundle_identifier="com.shoemoney.commanderinchief"
application/short_version="0.3.0"
application/version="0.3.0"
display/high_res=true
shader_baker/enabled=true
