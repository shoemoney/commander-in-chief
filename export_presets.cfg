[preset.0]

name="macOS (Apple Silicon + Intel universal)"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,docs/*,tools/*"
export_path="build/CommanderInChief-macos.zip"

[preset.0.options]

export/distribution_type=0
binary_format/architecture="universal"
application/bundle_identifier="com.shoemoney.commanderinchief"
application/short_version="0.3.0"
application/version="0.3.0"
display/high_res=true
shader_baker/enabled=true

[preset.1]

name="Linux x86_64"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,docs/*,tools/*"
export_path="build/CommanderInChief-linux.x86_64"

[preset.1.options]

binary_format/architecture="x86_64"
shader_baker/enabled=true

[preset.2]

name="Windows x86_64"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,docs/*,tools/*"
export_path="build/CommanderInChief-windows.exe"

[preset.2.options]

